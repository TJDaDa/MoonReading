  <body class="bg-sky">
    <div class="top">
      <div class="progressOut"><div class="progressIn" style="width: 87.5%"></div></div>
      <a href="/start/load/?prev=back"><img style="width: 40px; margin-left: 10px" id="back" src="../../../assets/signup_city/white-back.png" /></a>
      <p class="title">Moon Reading</p>
    </div>

    <div class="quiz q1">
      <h3>Select your city of birth</h3>
      <p>
        For a more accurate reading, please choose the closest city to where you were born. If you can’t find your city,
        choose a neighboring city.
      </p>

      <!-- Static integration: keep UI, but navigate locally on submit -->
      <form id="cityForm">
        <div style="float: left; width: 100%">
          <label for="country">Country of birth:</label>
          <select name="country" id="country" style="width: 100%">
            <option value="US" selected>United States</option>
            <option value="GB">United Kingdom</option>
            <option value="CA">Canada</option>
            <option value="AU">Australia</option>
          </select>
        </div>

        <div style="float: left; margin-top: 15px; width: 100%">
          <label for="region">Region:</label>
          <input id="region" name="region" class="form-control" placeholder="Region / State" />
        </div>

        <div style="float: left; margin-top: 15px; width: 100%">
          <label for="city">City of birth:</label>
          <input id="city" name="city" class="form-control" placeholder="City" required />
        </div>

        <br style="clear: both" />
        <br />
        <button class="cta" id="continue1" type="submit">Continue</button>
      </form>
    </div>

    <script src="../../../assets/signup_city/jquery.min.js"></script>
    <script>
      $(".progressIn").css("width", "87.5%");
      document.getElementById("cityForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const q = new URLSearchParams(window.location.search);
        q.set("country", document.getElementById("country").value);
        q.set("region", document.getElementById("region").value || "");
        q.set("city", document.getElementById("city").value || "");
        window.location.href = "/start/name/?" + q.toString();
      });
    </script>
  </body>
