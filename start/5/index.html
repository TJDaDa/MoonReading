    <script>
      $(".progressIn").css("width", "50%");
      const q = new URLSearchParams(window.location.search);
      const m = q.get("m");
      const d = q.get("d");
      const y = q.get("y");
      if (m && d && y) {
        document.getElementById("entered").textContent = `You entered: ${m}/${d}/${y}.`;
      }
      // carry query params forward
      document.querySelectorAll('a[href^="/start/6/"], a[href^="/start/load/"]').forEach((a) => {
        const u = new URL(a.href, window.location.origin);
        q.forEach((v, k) => u.searchParams.set(k, v));
        a.href = u.pathname + "?" + u.searchParams.toString();
      });
